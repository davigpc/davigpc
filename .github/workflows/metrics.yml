name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Checkout do repositório para poder commitar de volta
      - uses: actions/checkout@v4

      # Gera o arquivo SVG do Snake
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-contribution-grid-snake-dark.svg?palette=github-dark

      # Commita o arquivo gerado direto na branch main/master
      - name: Commit and push generated SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update snake contribution graph [skip ci]"
          file_pattern: "github-contribution-grid-snake-dark.svg"
